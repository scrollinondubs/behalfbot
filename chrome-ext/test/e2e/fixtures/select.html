<!doctype html><html><head><meta charset="utf-8"><title>Selects</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<style>body{font:14px sans-serif;margin:16px} .box{margin:8px 0}</style>
</head><body>
<div class="box"><label>Plain duration <select id="plain" aria-label="Plain duration">
  <option value="once">Once</option><option value="repeating">Multiple months</option><option value="forever">Forever</option>
</select></label></div>
<div class="box" id="root"></div>
<div class="box"><label>Name <input id="name" aria-label="Name" value="old"></label></div>
<div class="box"><button id="btn" aria-label="Save" style="width:200px;height:40px">Save</button></div>
<script>
  window.plainChanges = 0
  document.getElementById('plain').addEventListener('change', () => { window.plainChanges++ })
  window.keys = 0
  document.getElementById('name').addEventListener('keydown', () => { window.keys++ })
  window.clicks = []
  document.getElementById('btn').addEventListener('click', (e) => { window.clicks.push({ x: e.clientX, y: e.clientY, trusted: e.isTrusted }) })
  // A React-controlled select, like Stripe's coupon Duration: React state
  // only moves if React's own onChange fires.
  const e = React.createElement
  function Duration() {
    const [v, setV] = React.useState('once')
    window.reactDuration = v
    return e('label', null, 'React duration ',
      e('select', { id: 'react', 'aria-label': 'Duration', value: v, onChange: (ev) => setV(ev.target.value) },
        e('option', { value: 'once' }, 'Once'),
        e('option', { value: 'repeating' }, 'Multiple months'),
        e('option', { value: 'forever' }, 'Forever')))
  }
  ReactDOM.createRoot(document.getElementById('root')).render(e(Duration))
</script>
</body></html>
