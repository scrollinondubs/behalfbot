name: Shell unit tests

# shell-lint.yml runs shellcheck, which catches syntax and idiom problems but
# no behavior. The chassis-update healthcheck bug this job guards was valid
# shell that always returned success, so lint could never have caught it.
#
# Scoped to the self-contained suites only. test-daily-log-gather.sh is not
# here: it needs python3 + jq and is run by hand.

on:
  pull_request:
    branches: [main]
    paths:
      - 'chassis/scripts/_chassis-update-health.sh'
      - 'chassis/scripts/chassis-update.sh'
      - 'chassis/scripts/test-chassis-update-health.sh'
      - 'chassis/scripts/_env.sh'
      - 'chassis/scripts/resolve-plugin-root.sh'
      - 'chassis/scripts/test-plugin-root-resolution.sh'
      - 'chassis/scripts/gather-chassis-root-health.sh'
      - 'chassis/scripts/test-chassis-root-health.sh'
      - 'chassis/scripts/gather-container-liveness.sh'
      - 'chassis/scripts/test-container-liveness.sh'
      - 'chassis/scripts/resolve-chassis-root.sh'
      - 'chassis/scripts/test-chassis-root-resolution.sh'
      - 'docker/entrypoint.sh'
      - 'plugins/dating/scripts/emulator-state.sh'
      - 'plugins/dating/scripts/gather-dating-swipe.sh'
      - 'plugins/dating/scheduled-tasks/recovery-hooks.d/dating-emulator-recovery.sh'
      - 'plugins/dating/tests/test-emulator-state.sh'
      - 'chassis/scripts/bootstrap-audit.sh'
      - 'chassis/scripts/gather-bootstrap-audit.sh'
      - 'chassis/scripts/test-bootstrap-audit-memory.sh'
      - 'chassis/scripts/_memory-graph.sh'
      - 'chassis/scripts/memory-canary.sh'
      - 'chassis/scripts/gather-memory-canary.sh'
      - 'chassis/scripts/test-memory-canary.sh'
      - 'chassis/scripts/tests/stub-memory-server.sh'
      - 'chassis/scripts/gather-chassis-update-check.sh'
      - 'chassis/scripts/test-chassis-update-check.sh'
      - 'chassis/scripts/_chassis-changelog.sh'
      - 'chassis/scripts/test-chassis-update-mode.sh'
      - 'chassis/.claude/hooks/discord-reply-param-fix.sh'
      - 'chassis/scripts/test-discord-reply-param-fix.sh'
      - 'chassis/scripts/colima-ensure.sh'
      - 'chassis/scripts/test-colima-ensure.sh'
      - 'chassis/scripts/_control-flags.sh'
      - 'chassis/scripts/test-control-flags.sh'
      - 'chassis/scheduled-tasks/heartbeat-dispatcher.sh'
      - '.github/workflows/shell-tests.yml'
  push:
    branches: [main]
    paths:
      - 'chassis/scripts/_chassis-update-health.sh'
      - 'chassis/scripts/chassis-update.sh'
      - 'chassis/scripts/test-chassis-update-health.sh'
      - 'chassis/scripts/_env.sh'
      - 'chassis/scripts/resolve-plugin-root.sh'
      - 'chassis/scripts/test-plugin-root-resolution.sh'
      - 'chassis/scripts/gather-chassis-root-health.sh'
      - 'chassis/scripts/test-chassis-root-health.sh'
      - 'chassis/scripts/gather-container-liveness.sh'
      - 'chassis/scripts/test-container-liveness.sh'
      - 'chassis/scripts/resolve-chassis-root.sh'
      - 'chassis/scripts/test-chassis-root-resolution.sh'
      - 'docker/entrypoint.sh'
      - 'plugins/dating/scripts/emulator-state.sh'
      - 'plugins/dating/scripts/gather-dating-swipe.sh'
      - 'plugins/dating/scheduled-tasks/recovery-hooks.d/dating-emulator-recovery.sh'
      - 'plugins/dating/tests/test-emulator-state.sh'
      - 'chassis/scripts/bootstrap-audit.sh'
      - 'chassis/scripts/gather-bootstrap-audit.sh'
      - 'chassis/scripts/test-bootstrap-audit-memory.sh'
      - 'chassis/scripts/_memory-graph.sh'
      - 'chassis/scripts/memory-canary.sh'
      - 'chassis/scripts/gather-memory-canary.sh'
      - 'chassis/scripts/test-memory-canary.sh'
      - 'chassis/scripts/tests/stub-memory-server.sh'
      - 'chassis/scripts/gather-chassis-update-check.sh'
      - 'chassis/scripts/test-chassis-update-check.sh'
      - 'chassis/scripts/_chassis-changelog.sh'
      - 'chassis/scripts/test-chassis-update-mode.sh'
      - 'chassis/.claude/hooks/discord-reply-param-fix.sh'
      - 'chassis/scripts/test-discord-reply-param-fix.sh'
      - 'chassis/scripts/colima-ensure.sh'
      - 'chassis/scripts/test-colima-ensure.sh'
      - 'chassis/scripts/_control-flags.sh'
      - 'chassis/scripts/test-control-flags.sh'
      - 'chassis/scheduled-tasks/heartbeat-dispatcher.sh'
      - '.github/workflows/shell-tests.yml'
  workflow_dispatch:

jobs:
  chassis-update-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No docker daemon needed - the suite stubs the docker CLI on PATH.
      - run: bash chassis/scripts/test-chassis-update-health.sh

  plugin-root-resolution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Behavioural coverage for the v0.2.0 inert-feature bug: asserts the
      # resolved plugin root actually serves fetched plugins when a fetched
      # tree is present. No docker daemon, runs against temp dirs.
      - run: bash chassis/scripts/test-plugin-root-resolution.sh

  chassis-root-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Behavioural coverage for the #118 monitoring gap (#119): asserts the
      # scheduled chassis-root health gather FIRES on silent staleness
      # (mode=baked while a usable live tree exists) and on the exit-5
      # assertion state, and stays silent on healthy / pre-#118 installs.
      # No docker daemon, runs against temp dirs.
      - run: bash chassis/scripts/test-chassis-root-health.sh

  container-liveness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Behavioural coverage for the container-down alerting gap (#119):
      # stubs the docker CLI and proves the gather alerts when behalfbot is
      # exited / restarting / restart-looping / absent, and no-ops when the
      # docker socket is unreachable. No docker daemon needed.
      - run: bash chassis/scripts/test-container-liveness.sh
  chassis-root-resolution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Behavioural coverage for stale-baked-chassis drift: asserts a usable
      # live (mounted/vendored) chassis tree actually becomes the resolved
      # root, torn or cross-MAJOR trees force baked LOUDLY (exit 5), and
      # _env.sh resolves docker-exec sessions through the state symlink.
      # No docker daemon, runs against temp dirs.
      - run: bash chassis/scripts/test-chassis-root-resolution.sh

  bootstrap-audit-memory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Behavioural coverage for #142: bootstrap-audit Gap 3 read
      # env.MEMORY_FILE_PATH only, while the current .mcp.json.template sets no
      # env block, so the check could never pass on a healthy install. The
      # suite asserts both config shapes pass on a reachable graph AND that
      # every unreachable / non-writable graph still fails, so the fix cannot
      # degrade into a check that passes everything.
      - run: bash chassis/scripts/test-bootstrap-audit-memory.sh

  memory-canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Behavioural coverage for #145: bootstrap-audit Gap 3 proves the memory
      # graph is WRITABLE, not that anything can write and read it back, so a
      # reachable but broken graph passes it clean - the state Sean's install
      # sat in for sixteen days. The suite stubs the MCP memory server (no
      # network, no npx) and proves the canary fails on a namespace-invalid
      # path, a non-writable graph, an empty read after a successful write, and
      # a write that does not persist - plus that the read-back really does
      # happen in a second process.
      - run: bash chassis/scripts/test-memory-canary.sh
  chassis-update-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Behavioural coverage for #146: Gate 5 of the update check was
      # documented as a weekly debounce and implemented as a permanent mute,
      # so one unanswered notification opted the installer out of that version
      # forever. The suite proves an aged offer re-offers, a fresh one stays
      # silent, an explicit dismissal is still permanent, and every corrupt
      # timestamp fails open. No docker, no network - upstream is served from
      # a temp dir over file://.
      #
      # Also covers #147: chassis/VERSION only moves on a release commit, so
      # once local and upstream VERSION matched, every merge landing under
      # `## Unreleased` on main - the branch installs actually pull from - was
      # invisible to the checker. The suite proves a changed unreleased section
      # under an unchanged VERSION re-offers with an explicit kind=drift, an
      # unchanged one stays silent, dismissal is keyed to the digest rather
      # than muting the whole version, and a pre-#147 dismissed.json entry
      # still means what it always meant.
      - run: bash chassis/scripts/test-chassis-update-check.sh

  dating-emulator-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Behavioural coverage for the RUNNING_LOCKED blind spot: a PIN-locked
      # AVD passes every legacy readiness signal while unable to launch any
      # app. The suite stubs adb on PATH and proves the probe distinguishes
      # locked from unlocked, the gather reports emulator_locked instead of
      # ready, and the recovery hook unlocks rather than restart-looping.
      - run: bash plugins/dating/tests/test-emulator-state.sh

  chassis-update-mode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Behavioural coverage for #152: detect_mode read CHASSIS_HOME's git
      # origin, so an overlay-mount install (a separate behalfbot clone mounted
      # underneath the customer repo) fell through to vendored_subtree and
      # planned a subtree pull into a foreign repository. The suite proves all
      # three layouts classify, an unrecognised one refuses instead of
      # defaulting to the destructive strategy, and the final status line no
      # longer reports success for a run that pulled nothing. No docker daemon,
      # no network - upstream is served over file:// and docker is stubbed.
      #
      # Extended for #147 with the applier half of unreleased drift. A checker
      # that can see drift while the applier answers "Already up to date"
      # delivers nothing, and two of the three blockers (the post-pull
      # advanced-tree check and the healthcheck) are only reachable by a REAL
      # run, so those scenarios pull for real against a local bare repo.
      - run: bash chassis/scripts/test-chassis-update-mode.sh

  discord-reply-param-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Behavioural coverage for the four-hour Discord silence of 2026-08-13:
      # the reply tool takes `text`, a call passing `message` fails inside the
      # plugin's chunk() splitter, and the resulting error names a plugin
      # internal rather than the parameter. The suite proves the rewrite fires
      # and carries chat_id / reply_to / files across, that a correct call
      # produces NO output (this hook runs ahead of every reply, so silence on
      # the common path is the safety property), and that malformed stdin exits
      # 0 rather than blocking - a hook that mutes the channel on bad input
      # defeats its own purpose. No docker, no network.
      - run: bash chassis/scripts/test-discord-reply-param-fix.sh

  colima-ensure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Behavioural coverage for new-jaxity#550: an unclean shutdown leaves
      # stale lima pid/socket files, the profile comes back Broken, and a bare
      # `colima start` dies on the stale ha.sock on every boot forever. The
      # suite stubs colima and docker, overrides the OS probe (so it runs on a
      # Linux runner with no VM), and proves the wrapper escalates to
      # stop --force, retries once, and verifies `docker ps` rather than
      # trusting a start that exited 0 onto a dead socket.
      #
      # Two assertions are the load-bearing ones: no code path ever issues
      # `colima delete` or `colima start --reset`. Both destroy the VM disk
      # image and every docker volume on it.
      #
      # Proven to discriminate: 14 assertions fail against a naive
      # `colima start` implementation.
      - run: bash chassis/scripts/test-colima-ensure.sh
  control-flags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Behavioural coverage for the remote kill switch's flag arithmetic
      # (behalfbot#550). The auto-lift check this library replaces used
      # `date -j`, which is BSD only: inside the Linux container every
      # `auto_lift_after` parsed as epoch 0 and lifted on the next tick, while
      # logging the same line a working auto-lift logs. The suite stubs `date`
      # on PATH to force each dialect, proves a future expiry stays ON under
      # GNU, that an unparseable expiry fails CLOSED, and asserts the pre-fix
      # idiom still gets it wrong so the discrimination cannot rot away.
      - run: bash chassis/scripts/test-control-flags.sh

  # ---------------------------------------------------------------------------
  # Everything above runs on ubuntu-latest: bash 5.x, GNU coreutils. That is
  # ONE of the two platforms this code runs on. The other is the operator's
  # macOS host, where /bin/bash is 3.2.57 (Apple has shipped 3.2 since 2007 for
  # licensing reasons) with a BSD userland. The repo's own comments already say
  # "host is macOS/BSD, container is Linux" - CI just never checked.
  #
  # Three bugs shipped GREEN through the ubuntu-only lane on 2026-09-05
  # (new-jaxity#550) and broke only once they reached a real machine:
  #
  #   1. ${BAKED_ROOTS[-1]:-} in chassis/scripts/resolve-plugin-root.sh.
  #      Negative array subscripts need bash 4.3. On 3.2 it is a `bad array
  #      subscript` error that expands to empty, so the resolver handed callers
  #      an EMPTY plugin root on the compose-failure path - the exact silent
  #      no-op its own comment forbids. Fixed in #197.
  #   2. `stat -f %m` in the colima work. A filesystem query on GNU coreutils,
  #      an mtime query on BSD. Chained with `||` the outputs concatenated and
  #      silently disabled a recycled-pid lock breaker. Fixed in #193.
  #   3. `date -j -f` in is_conservation_mode(). BSD only, so inside the Debian
  #      container lift_epoch became 0, `now >= 0` was always true, and any
  #      conservation flag with an auto_lift_after was silently lifted on the
  #      very next tick while logging the same line a working auto-lift logs.
  #      Fixed in #195.
  #
  # Note the direction of 3: that one broke on LINUX because the code was
  # BSD-only. So this is not "add macOS coverage", it is "both target platforms
  # must be exercised". Bug 1 is the only one of the three that needs bash 3.2;
  # 2 and 3 are dialect splits that either lane can catch. Together the two
  # lanes cover both directions. Do not delete this job as redundant with the
  # ubuntu ones - they are the same suites against a deliberately different
  # interpreter and userland, which is the whole point.
  #
  # Runs in parallel with every ubuntu job and adds no serial time to a PR.
  # A macOS runner is billed at 10x, but this repo is public, so Actions
  # minutes are free and the multiplier costs nothing.
  #
  # Blocking, not advisory. A red macOS run that cannot stop a merge is
  # decoration, and decoration is what the postmortem is about.
  macos-bash32:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # The suites invoke the scripts under test as `bash "$SCRIPT"`, and half
      # the scripts carry `#!/usr/bin/env bash`. Both resolve bash through
      # PATH. GitHub's macOS image ships Homebrew, so PATH may well hand out
      # bash 5.x - and then this entire lane would be a second ubuntu lane
      # wearing a macOS hat: green for the wrong reason, which is precisely the
      # failure class being fixed. Pin it.
      - name: Pin bash to the stock macOS /bin/bash
        run: |
          SHIM="${RUNNER_TEMP}/bash32"
          mkdir -p "$SHIM"
          ln -sf /bin/bash "$SHIM/bash"
          echo "$SHIM" >> "$GITHUB_PATH"

      # GITHUB_PATH only takes effect in LATER steps, so the assertion has to
      # be its own step. It fails the job rather than warning: a lane that
      # quietly downgrades to bash 5 proves nothing.
      - name: Prove the environment is bash 3.2 and BSD, or fail
        run: |
          set -u
          echo "which -a bash:"
          which -a bash || true
          BASH_VER="$(bash -c 'echo "$BASH_VERSION"')"
          ENV_VER="$(/usr/bin/env bash -c 'echo "$BASH_VERSION"')"
          echo "bash          -> $BASH_VER"
          echo "env bash      -> $ENV_VER"
          echo "/bin/bash     -> $(/bin/bash -c 'echo "$BASH_VERSION"')"
          FAILED=0
          case "$BASH_VER" in
            3.2.*) ;;
            *) echo "::error::PATH bash is $BASH_VER, expected 3.2.x - the shim did not take"; FAILED=1 ;;
          esac
          case "$ENV_VER" in
            3.2.*) ;;
            *) echo "::error::env bash is $ENV_VER, expected 3.2.x - shebang resolution is not pinned"; FAILED=1 ;;
          esac
          # Bug 1's construct must actually be broken here. If a future runner
          # image makes this work, the lane has stopped testing bash 3.2 and
          # should fail loudly rather than pass quietly.
          # Note the assignment: `echo "${a[-1]}"` still exits 0 on 3.2
          # because echo succeeds after the expansion errors to empty, which
          # is exactly why bug 1 was silent. Compare the VALUE.
          if bash -c 'a=(one two); v="${a[-1]}"; [ "$v" = two ]' 2>/dev/null; then
            echo "::error::negative array subscripts WORK in this bash - this is not 3.2"
            FAILED=1
          fi
          # BSD userland, both directions.
          if ! stat -f %m /etc/hosts >/dev/null 2>&1; then
            echo "::error::stat does not accept BSD -f - userland is not BSD"; FAILED=1
          fi
          if stat -c %Y /etc/hosts >/dev/null 2>&1; then
            echo "::error::stat accepts GNU -c - GNU coreutils are shadowing BSD on PATH"; FAILED=1
          fi
          if ! date -j -f "%Y-%m-%dT%H:%M:%SZ" "1970-01-01T00:00:00Z" +%s >/dev/null 2>&1; then
            echo "::error::date does not accept BSD -j - userland is not BSD"; FAILED=1
          fi
          if date -d "1970-01-01" +%s >/dev/null 2>&1; then
            echo "::error::date accepts GNU -d - GNU coreutils are shadowing BSD on PATH"; FAILED=1
          fi
          exit "$FAILED"

      # Same suites the ubuntu jobs run, no more and no less. Deliberate
      # parity: adding suites the Linux lane does not run is a different
      # change, and a divergence between the two lists is how one lane
      # quietly stops covering something.
      #
      # Excluded, same as the ubuntu lane: test-daily-log-gather.sh,
      # test-compose-verify.sh, test-merge-plugin-triggers.sh and
      # test-validate-heartbeats.sh are not wired into CI on either platform.
      #
      # One loop rather than thirteen jobs: thirteen macOS runners would each
      # pay the ~30s image spin-up to run a suite that takes under 3 seconds.
      # Every suite runs even when an earlier one fails, so one red suite
      # cannot hide the other twelve.
      - name: Run the shell suites under bash 3.2 + BSD userland
        run: |
          set -u
          SUITES="
          chassis/scripts/test-chassis-update-health.sh
          chassis/scripts/test-plugin-root-resolution.sh
          chassis/scripts/test-chassis-root-health.sh
          chassis/scripts/test-container-liveness.sh
          chassis/scripts/test-chassis-root-resolution.sh
          chassis/scripts/test-bootstrap-audit-memory.sh
          chassis/scripts/test-memory-canary.sh
          chassis/scripts/test-chassis-update-check.sh
          chassis/scripts/test-chassis-update-mode.sh
          chassis/scripts/test-discord-reply-param-fix.sh
          chassis/scripts/test-colima-ensure.sh
          chassis/scripts/test-control-flags.sh
          plugins/dating/tests/test-emulator-state.sh
          "
          FAILED=""
          EMPTY=""
          TOTAL=0
          RAN=0
          for suite in $SUITES; do
            echo "::group::$suite"
            LOG="${RUNNER_TEMP}/$(basename "$suite").log"
            if bash "$suite" > "$LOG" 2>&1; then
              RC=0
            else
              RC=$?
            fi
            cat "$LOG"
            echo "::endgroup::"
            RAN=$(( RAN + 1 ))
            # Assertion count, read out of whichever summary line the suite
            # prints ("N passed" or "PASS: N"). A suite that exits 0 having
            # asserted nothing is the failure this whole lane exists to catch,
            # so zero is a failure even when the exit code is clean.
            N=$(grep -oE '([0-9]+ passed|PASS: +[0-9]+)' "$LOG" | grep -oE '[0-9]+' | awk '{s+=$1} END{print s+0}')
            TOTAL=$(( TOTAL + N ))
            if [ "$RC" -ne 0 ]; then
              echo "::error file=$suite::suite FAILED under bash 3.2 / BSD userland (exit $RC, $N assertions)"
              FAILED="$FAILED $suite"
            elif [ "$N" -eq 0 ]; then
              echo "::error file=$suite::suite exited 0 but reported ZERO assertions"
              EMPTY="$EMPTY $suite"
            else
              echo "ok  $suite ($N assertions)"
            fi
          done

          echo
          echo "suites run: $RAN   assertions: $TOTAL"

          # Floor against a silent collapse - a broken checkout, a renamed
          # summary line, a loop that iterates over nothing. The suites totalled
          # 365 assertions when this lane was added. Raise it as they grow;
          # never lower it to make a red build green.
          if [ "$TOTAL" -lt 340 ]; then
            echo "::error::only $TOTAL assertions across $RAN suites, expected at least 340 - the lane is not exercising what it claims to"
            exit 1
          fi
          if [ -n "$FAILED" ] || [ -n "$EMPTY" ]; then
            [ -n "$FAILED" ] && echo "FAILED:$FAILED"
            [ -n "$EMPTY" ] && echo "NO ASSERTIONS:$EMPTY"
            exit 1
          fi
          echo "all $RAN suites pass on bash 3.2 + BSD userland"
