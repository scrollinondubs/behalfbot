name: Shell scripts lint

on:
  pull_request:
    branches: [main]
    paths:
      - '**/*.sh'
      - '.github/workflows/shell-lint.yml'
  push:
    branches: [main]
    paths:
      - '**/*.sh'
      - '.github/workflows/shell-lint.yml'
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ludeeus/action-shellcheck@master
        with:
          severity: error
          scandir: '.'
          # These are zsh (not bash/sh); shellcheck doesn't support zsh, so
          # exclude them from the scan. Both carry a #!/bin/zsh shebang - keep
          # this list in sync with:
          #   grep -rl '^#!/bin/zsh' --include='*.sh' .
          ignore_names: heartbeat-dispatcher.sh test_state_write_race.sh test_fire_caps.sh test_fire_caps_e2e.sh
